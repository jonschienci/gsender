plugins { id 'com.android.application' }
android {
    namespace 'com.gsender.android'
    buildFeatures { buildConfig true }
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.gsender.android'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '1.7.0-dev-android.13'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DANDROID_STL=c++_shared' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets { main { jniLibs.srcDirs = ['../vendor/node/bin'] } }
    packaging { jniLibs { useLegacyPackaging = true } }
    signingConfigs { debug { storeFile rootProject.file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    buildTypes { debug { debuggable true; signingConfig signingConfigs.debug } }
}
dependencies { implementation project(':usb') }
