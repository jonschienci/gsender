plugins { id 'com.android.application' }
def nodeRuntimeRoot = providers.gradleProperty('nodeRuntimeRoot').map { file(it) }.getOrElse(rootProject.file('vendor/node'))
def nodeRuntimeAbis = providers.gradleProperty('nodeRuntimeAbis').getOrElse('arm64-v8a,armeabi-v7a').split(',')
def nodeCppStandard = providers.gradleProperty('nodeRuntimeRoot').isPresent() ? '-std=c++20' : '-std=c++17'
android {
    namespace 'com.gsender.android'
    buildFeatures { buildConfig true }
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.gsender.android'
        minSdk 26
        targetSdk 35
        versionCode 23
        versionName (providers.gradleProperty('nodeRuntimeRoot').isPresent() ? '1.7.0-dev-android.23-node24-prototype' : '1.7.0-dev-android.23-node18')
        resValue 'string', 'app_name', "gSender Android Build ${versionCode}"
        ndk { abiFilters.addAll(nodeRuntimeAbis) }
        externalNativeBuild { cmake { cppFlags nodeCppStandard; arguments '-DANDROID_STL=c++_shared', "-DNODE_ROOT=${nodeRuntimeRoot.absolutePath}" } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets { main { jniLibs.srcDirs = [new File(nodeRuntimeRoot, 'bin')] } }
    packaging { jniLibs { useLegacyPackaging = true } }
    signingConfigs { debug { storeFile rootProject.file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    buildTypes {
        debug { debuggable true; signingConfig signingConfigs.debug }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug // Preserve update compatibility with previous tablet builds.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
dependencies { implementation project(':usb') }

// Keep upstream runtime provenance and license with prototype APKs.
if (providers.gradleProperty('nodeRuntimeRoot').isPresent()) {
    def notices = layout.buildDirectory.dir('generated/nodeRuntimeAssets')
    def runtimeNotices = tasks.register('copyNodeRuntimeNotices', Copy) {
        from(nodeRuntimeRoot) { include 'LICENSE', 'build-info.json' }
        into(notices.map { it.dir('node-runtime') })
    }
    android.sourceSets.main.assets.srcDir(notices)
    tasks.named('preBuild').configure { dependsOn(runtimeNotices) }
}
